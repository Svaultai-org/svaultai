# API response policy. This strict JSON/API CSP is NOT the Flutter web policy.
# nginx 1.24: include this again inside any location/if that adds other headers,
# because defining add_header at a child level replaces all inherited headers.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
