# Same-origin web login only. Exact URI mappings cannot proxy arbitrary /api/ paths.
# These JSON routes use the installed API headers; Flutter HTML keeps its policy.
location = /api/auth/zk-login-init {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8000/auth/zk-login-init;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The backend's verified single-hop boundary compares X-Real-IP with
    # this last actual hop, never with a caller-controlled leftmost value.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/snippets/svaultai-api-security-headers.conf;
}

location = /api/auth/zk-login-finalize {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8000/auth/zk-login-finalize;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/snippets/svaultai-api-security-headers.conf;
}
