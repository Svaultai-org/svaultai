# Production-only server-context include. Match normalized URI paths, including
# trailing slashes, the Swagger OAuth redirect, and the web proxy's /api alias.
# Query strings do not participate in nginx location matching.
location ~ ^/(?:api/)?(?:docs|redoc)(?:/|$) {
    return 404;
}
location ~ ^/(?:api/)?openapi\.json(?:/|$) {
    return 404;
}
