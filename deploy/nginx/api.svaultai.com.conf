# Production API template; adapt the existing live server block in place.
# Keep its managed TLS certificate, upstream, logging, and operational settings.
# Install snippets first. This template is not automatically deployed.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.svaultai.com;

    # TLS certificate/key directives are managed externally.
    server_tokens off;
    client_max_body_size 100M;

    # nginx owns these five headers, including proxy-generated errors. Keep
    # upstream CORS, cache policy, and other headers unchanged.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/snippets/svaultai-api-security-headers.conf;
    include /etc/nginx/snippets/svaultai-hide-api-docs.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the public trusted edge: overwrite client-provided values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.svaultai.com;
    return 301 https://$host$request_uri;
}
