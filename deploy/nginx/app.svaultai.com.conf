# 2026-07-14 (Round 10 — stale-cache fix): Nginx configuration for
# app.svaultai.com. Committed to the repo so infrastructure changes
# are reviewable and version-controlled — this file is NOT auto-
# deployed. See docs/DEPLOYMENT_RUNBOOK.md for the copy-and-reload
# procedure.
#
# Root problem this file fixes:
#
#   Default Flutter web builds ship an offline-first service worker
#   that caches the app shell (index.html + main.dart.js +
#   flutter_bootstrap.js + assets) into Cache Storage. Combined
#   with default HTTP caching, browsers can serve an installed PWA's
#   old shell indefinitely — users have to open Incognito, log out,
#   or clear browser data to receive a new deployment. Unacceptable
#   for a financial app.
#
# Fix: build with `--pwa-strategy=none` (see scripts/build-web-
# release.ps1) AND serve the shell files below with `no-store` so
# the browser always revalidates them on every navigation. Assets
# with content-hashed filenames (canvaskit blobs, tree-shaken font
# assets, image URLs shipped with hash query strings) may still use
# long immutable caching — only when their filename truly changes
# with content.

# Application-shell files. Every one MUST be marked never-cache so
# the running tab picks up a new release the next time the user
# resumes it.
map $uri $vaultai_is_shell_file {
    default 0;
    /                             1;
    /index.html                   1;
    /flutter_bootstrap.js         1;
    /flutter.js                   1;
    /main.dart.js                 1;
    /flutter_service_worker.js    1;
    /release.json                 1;
    /manifest.json                1;
    /favicon.png                  1;
    /favicon.ico                  1;
    /favicon-16x16.png            1;
    /favicon-32x32.png            1;
    /apple-touch-icon.png         1;
}

# Only the marketing root, public Help Center, and static privacy policy are
# intended search landing pages. An empty map value suppresses the header.
map $uri $vaultai_robots_header {
    default                     "noindex, nofollow, noarchive";
    /                           "";
    /help-and-faq-public        "";
    /help-and-faq-public/       "";
    /privacy                    "";
    /privacy/                   "";
    /robots.txt                 "";
    /sitemap.xml                "";
    /favicon.ico                "";
    /favicon.png                "";
    /favicon-16x16.png          "";
    /favicon-32x32.png          "";
    /apple-touch-icon.png       "";
    /og-image.png               "";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.svaultai.com;

    # <<< CERT lines managed externally — not shipped in repo. >>>

    root /opt/svaultai/frontend/current;
    index index.html;

    # Preserve API + SSE endpoints (websocket-friendly proxying is
    # unrelated to this cache fix; keep whatever the current runbook
    # already has).
    location /api/ {
        proxy_pass http://vaultai-backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE + long-poll routes must not buffer.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # release.json — the update-detection heartbeat. MUST be
    # `no-store`. Serving 304 based on stale upstream metadata
    # would break update detection.
    location = /release.json {
        try_files /release.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    # Shell files. Every navigation revalidates.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    location = /flutter.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    # Empty (--pwa-strategy=none) service worker. Also `no-store`
    # so the browser picks up the empty body every time and does
    # not resurrect an old offline-first SW from disk cache.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        etag off;
        if_modified_since off;
    }

    # 2026-07-14 (Round 11 — correct asset caching):
    #
    #   Flutter 3.38 does NOT content-hash filenames under
    #   `/assets/` or `/canvaskit/`. The files there include
    #   stable names such as:
    #
    #     assets/AssetManifest.bin
    #     assets/AssetManifest.bin.json
    #     assets/FontManifest.json
    #     assets/NOTICES
    #     assets/fonts/MaterialIcons-Regular.otf
    #     assets/packages/…
    #     canvaskit/canvaskit.js
    #     canvaskit/canvaskit.wasm
    #     canvaskit/skwasm.wasm
    #
    #   Their contents change across releases but their filenames
    #   do not. Marking these `immutable` would strand users on
    #   the old bundle exactly the way the old service worker did.
    #
    #   Use `no-cache, must-revalidate` — the browser MAY reuse
    #   its cached copy, but MUST revalidate with the server
    #   (ETag / If-Modified-Since) before serving it. Nginx keeps
    #   ETag on for these paths so 304 responses are cheap.
    #
    #   Truly content-hashed assets (if a future Flutter version
    #   adds them, or if we ship user content with hash-in-name)
    #   can be given the immutable rule via a stricter location
    #   pattern like `^/assets/hash-[a-f0-9]{40}\.\w+$`.
    # Public Google Play privacy policy. Serve the static HTML policy
    # directly so it is reachable without login and without requiring
    # a crawler to execute the Flutter app.
    location = /privacy {
        try_files /privacy/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    location = /privacy/ {
        try_files /privacy/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        etag off;
        if_modified_since off;
    }

    location ~* ^/assets/ {
        add_header Cache-Control "public, no-cache, must-revalidate" always;
    }

    location ~* ^/canvaskit/ {
        add_header Cache-Control "public, no-cache, must-revalidate" always;
    }

    # Everything else falls through to try_files — do not add a
    # blanket long-cache directive here, or you'll re-introduce the
    # very bug this config was written to fix.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag $vaultai_robots_header always;
        # Files reaching this fallback are almost always the SPA
        # entry re-hit. Same no-store as the shell files above.
        if ($vaultai_is_shell_file) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }
    }

    # Enforce HTTPS + security posture. Do not weaken these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.svaultai.com;
    return 301 https://$host$request_uri;
}
