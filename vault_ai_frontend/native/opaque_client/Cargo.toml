[package]
name = "vaultai_opaque_client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native C-ABI OPAQUE client for VaultAI Android and Apple platforms."

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
opaque-ke = { version = "4.0", features = ["argon2"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
pbkdf2 = "0.12"
serde_json = "1"
zeroize = "1"
