name: vault_ai_frontend
description: SVaultAI — private encrypted digital vault (mobile + web client).
publish_to: 'none'
# Store-facing marketing version + build number. Bump the +N build
# number for EVERY submission (App Store Connect + Play Console
# reject a duplicate build number for the same marketing version).
version: 1.0.19+23

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UX1.5 - Flutter intl + ARB localization. Bundles 7 locales:
  # en, ar, fr, es, ja, ko, zh. Used by lib/l10n/*.arb.
  flutter_localizations:
    sdk: flutter
  intl: any

  # Web-only — gives public and authenticated routes clean URLs instead of
  # hash-prefixed paths. The analyzer requires this explicit SDK dependency.
  flutter_web_plugins:
    sdk: flutter

  # State management
  provider: ^6.1.5

  # Local storage
  shared_preferences: ^2.3.2

  # UI icons
  cupertino_icons: ^1.0.6

  # External links (optional, safe to keep)
  url_launcher: ^6.3.2

  # Google Play Billing / future StoreKit client surface. Paid storage is
  # verified by the SVaultAI backend before this client completes a purchase.
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.11

  # Auth and crypto utilities — vault_name + PIN model uses convert /
  # pointycastle / crypto for PIN-derived AES-GCM material; the
  # session token is a plain HMAC-signed string carried via the
  # http package's Authorization header.
  convert: ^3.1.2
  pointycastle: ^3.7.4
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.6
  ffi: ^2.1.3

  # ✅ REQUIRED FOR BACKEND CHAT
  http: ^1.2.1

  # ✅ REQUIRED FOR FILE & IMAGE PICKING
  file_picker: ^8.0.0
  cryptography: ^2.9.0

  # Voice input (Phase 9.4) — browser-native STT on web, on-device on mobile.
  # No audio leaves the device.
  speech_to_text: ^7.0.0

  # Audio/video capture. Web audio/video stays in browser memory;
  # native audio uses an app-private temp file that is deleted after
  # reading, and native camera capture feeds the same encrypted upload
  # pipeline as picker-selected files.
  record: ^6.0.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  permission_handler: ^12.0.3

  # 2026-06-29 — Receive-only QR for Crypto Vault. Pure Dart, no
  # native code, no network. Renders the saved crypto wallet address
  # as a QR matrix the user can scan to receive funds.
  #
  # Receive-only: the QR encodes only the raw address (e.g. "bc1q..."),
  # NEVER a transaction request, NEVER an amount. The app does not
  # sign, broadcast, generate wallets, or move funds.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  zxing2: ^0.2.4
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Used directly by native privacy acceptance fixtures.
  uuid: ^4.5.3
  flutter_lints: ^5.0.0

  # Store-submission asset generators (Phase-A release hardening).
  # Both are dev-only: they run at build-time via
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  # and write PNG/XML assets into android/app/src/main/res/ and
  # ios/Runner/Assets.xcassets/. Neither ships in the runtime bundle.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash:  ^2.4.7

flutter:
  uses-material-design: true
  # UX1.5 - enables `flutter gen-l10n` generation from lib/l10n/*.arb.
  generate: true
  assets:
    # Branding master used by flutter_launcher_icons +
    # flutter_native_splash. Copied from
    # ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
    # into a canonical location so the asset generators have a
    # stable path across future icon iterations.
    - assets/branding/


# ---- flutter_launcher_icons config -----------------------------------
# Generates:
#   android/app/src/main/res/mipmap-*/ic_launcher.png (all densities)
#   android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml (adaptive)
#   android/app/src/main/res/drawable/ic_launcher_foreground.png
#   android/app/src/main/res/values/colors.xml (adaptive background)
#   ios/Runner/Assets.xcassets/AppIcon.appiconset/* (every iOS size)
# Run:  dart run flutter_launcher_icons
# ----------------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/vaultai-icon-1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F1115"
  adaptive_icon_foreground: "assets/branding/vaultai-icon-foreground-1024.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false


# ---- flutter_native_splash config ------------------------------------
# Generates a dark splash matching the web manifest background_color
# (#0F1115) for both Android (drawable + values styles) and iOS
# (LaunchScreen.storyboard + LaunchImage asset set). Run:
#   dart run flutter_native_splash:create
# ----------------------------------------------------------------------
flutter_native_splash:
  color:            "#0F1115"
  color_dark:       "#0F1115"
  image:            "assets/branding/vaultai-icon-1024.png"
  image_dark:       "assets/branding/vaultai-icon-1024.png"
  android_12:
    icon_background_color:      "#0F1115"
    icon_background_color_dark: "#0F1115"
    image:                      "assets/branding/vaultai-icon-1024.png"
    image_dark:                 "assets/branding/vaultai-icon-1024.png"
  android: true
  ios: true
  web: false
