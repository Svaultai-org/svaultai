<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Primary meta -->
  <title>VaultAI</title>
  <meta name="description" content="VaultAI is a private digital vault for securely storing and managing passwords, documents, IDs, files, secure notes, and crypto wallet records.">
  <link rel="canonical" href="https://svaultai.com">
  <meta name="theme-color" content="#10A37F">
  <meta name="color-scheme" content="dark">

  <!-- Open Graph / Facebook / iMessage / WhatsApp / Slack / LinkedIn / Discord -->
  <meta property="og:title" content="VaultAI">
  <meta property="og:description" content="Your private AI-powered digital vault.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://svaultai.com">
  <meta property="og:image" content="https://svaultai.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="VaultAI — Your private AI-powered digital vault.">
  <meta property="og:site_name" content="VaultAI">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VaultAI">
  <meta name="twitter:description" content="Your private AI-powered digital vault.">
  <meta name="twitter:image" content="https://svaultai.com/og-image.png">
  <meta name="twitter:image:alt" content="VaultAI — Your private AI-powered digital vault.">

  <!-- iOS / Apple / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VaultAI">
  <meta name="application-name" content="VaultAI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 2026-07-14 (Round 12 — explicit SW retirement bootstrap):
       Flutter's `--pwa-strategy=none` build does NOT register a
       service worker. Existing users still controlled by the
       pre-Round-11 offline-first Flutter SW would therefore never
       fetch our migration SW body — they'd stay stuck on the
       stale app shell indefinitely. This bootstrap explicitly
       registers `/flutter_service_worker.js?v=<full-sha>` at
       scope `/` on every page load. The `?v=` version is
       substituted at build time by scripts/build-web-release.*
       — the raw file with the literal `__VAULTAI_APP_RELEASE__`
       token short-circuits without registering. -->
  <script src="vaultai-sw-bootstrap.js"></script>
  <!-- 2026-07-14 (ZK Phase 2): serenity-kit @serenity-kit/opaque@1.1.0
       vendored under /assets/opaque/. The ESM bundle contains the
       audited RFC 9807 opaque-ke Rust core as WebAssembly. The init
       loader awaits WASM instantiation and exposes only the CLIENT
       half to `globalThis.vaultaiOpaqueClient` for Dart interop. -->
  <script type="module" src="assets/opaque/vaultai-opaque-init.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
