# Reference-only production compose file. Copy to
# `docker-compose.production.yml`, fill in the secrets, and adapt to
# your host (managed Postgres vs. self-hosted, Redis provider,
# reverse proxy, etc.). Do NOT commit the filled-in copy.
#
# Assumes:
#   * TLS terminates at a reverse proxy in front (Caddy, nginx,
#     Cloudflare Tunnel, etc.) that forwards to backend:8000
#   * Managed PostgreSQL reachable at DATABASE_URL
#   * Managed Redis reachable at VAULTAI_RATE_LIMIT_REDIS_URL

services:
  backend:
    image: vaultai-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:

      - "127.0.0.1:8000:8000"
    environment:

      VAULTAI_ENV: production

      DATABASE_URL:            ${DATABASE_URL}
      VAULT_SESSION_SECRET:    ${VAULT_SESSION_SECRET}
      OPENAI_API_KEY:          ${OPENAI_API_KEY}
      DESCOPE_PROJECT_ID:      ${DESCOPE_PROJECT_ID}

      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX}
      VAULTAI_ALLOWED_REDIRECT_ORIGINS: ${VAULTAI_ALLOWED_REDIRECT_ORIGINS}
      FRONTEND_BASE_URL:       https://app.svaultai.com

      VAULTAI_SECURITY_HEADERS_ENABLED:    "true"
      VAULTAI_DEBUG_ENDPOINTS_ENABLED:     "false"
      VAULTAI_DEVICE_GATE_DEV_AUTO_TRUST:  "false"
      MASS_ACTION_PROTECTION_ENABLED:      "true"

      # Keep this matrix in lockstep with the production web build script.
      # A missing backend flag defaults false and makes the corresponding
      # authenticated route return 404.
      ZK_V2_READ_ENABLED:              "true"
      ZK_V2_WRITE_ENABLED:             "false"
      ZK_V2_MIGRATION_ENABLED:         "false"
      MEMORY_V2_READ_ENABLED:          "true"
      MEMORY_V2_WRITE_ENABLED:         "true"
      MEMORY_V2_MIGRATION_ENABLED:     "false"
      FILE_V2_READ_ENABLED:            "true"
      FILE_V2_WRITE_ENABLED:           "true"
      FILE_V2_MIGRATION_ENABLED:       "false"
      WALLET_BACKUP_V2_READ_ENABLED:   "false"
      WALLET_BACKUP_V2_WRITE_ENABLED:  "false"
      WALLET_BACKUP_V2_MIGRATION_ENABLED: "false"
      WALLET_V2_READ_ENABLED:          "false"
      WALLET_V2_WRITE_ENABLED:         "false"
      WALLET_V2_MIGRATION_ENABLED:     "false"
      PRIVATE_VAULT_LOCAL_ROUTING_ENABLED: "false"

      RATE_LIMIT_ENABLED:            "true"
      VAULTAI_RATE_LIMIT_BACKEND:    redis
      VAULTAI_RATE_LIMIT_REDIS_URL:  ${VAULTAI_RATE_LIMIT_REDIS_URL}

      VAULTAI_GOOGLE_PLAY_BRIDGE_URL: ${VAULTAI_GOOGLE_PLAY_BRIDGE_URL}
      VAULTAI_GOOGLE_PLAY_BRIDGE_HMAC_SECRET: ${VAULTAI_GOOGLE_PLAY_BRIDGE_HMAC_SECRET}
      VAULTAI_GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: svaultai-play-billing@svaultai-production.iam.gserviceaccount.com
      VAULTAI_GOOGLE_PLAY_PACKAGE_NAME: com.svaultai.app
      VAULTAI_GOOGLE_PLAY_RTDN_AUDIENCE: https://api.svaultai.com/billing/google-play/rtdn
      VAULTAI_GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL: svaultai-play-rtdn-push@svaultai-production.iam.gserviceaccount.com
      VAULTAI_GOOGLE_PLAY_ALLOW_TEST_PURCHASES: "false"

      STRIPE_API_KEY:                 ${STRIPE_API_KEY}
      STRIPE_PUBLISHABLE_KEY:         ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET:          ${STRIPE_WEBHOOK_SECRET}
      STRIPE_STORAGE_BLOCK_PRICE_ID:  ${STRIPE_STORAGE_BLOCK_PRICE_ID}
      STRIPE_PRODUCT_ID:              ${STRIPE_PRODUCT_ID}
      STRIPE_CHECKOUT_SUCCESS_URL:    https://app.svaultai.com/storage?checkout=success
      STRIPE_CHECKOUT_CANCEL_URL:     https://app.svaultai.com/storage?checkout=cancel
      STRIPE_PORTAL_RETURN_URL:       https://app.svaultai.com/storage

      INACTIVE_UNPAID_DELETE_ENABLED: "true"
      INACTIVE_UNPAID_DELETE_DAYS:    "183"

      VAULTAI_CRYPTO_WALLET_ENGINE_ENABLED: "true"
      VAULTAI_CRYPTO_DEFAULT_NETWORK:       ethereum_mainnet
      VAULTAI_CRYPTO_ETH_MAINNET_RECEIVE_ENABLED:       "true"
      VAULTAI_CRYPTO_ETH_MAINNET_ERC20_RECEIVE_ENABLED: "true"
      VAULTAI_CRYPTO_ETH_MAINNET_SEND_ENABLED:          "false"
      VAULTAI_CRYPTO_MAINNET_SEND_PAUSED:               "true"
      ETHEREUM_MAINNET_RPC_URL:             ${ETHEREUM_MAINNET_RPC_URL}
      ETHEREUM_MAINNET_TX_INDEXER_API_KEY:  ${ETHEREUM_MAINNET_TX_INDEXER_API_KEY}
      SOLANA_RPC_URL:                       ${SOLANA_RPC_URL}
      SOLANA_TX_INDEXER_API_KEY:            ${SOLANA_TX_INDEXER_API_KEY}
      TRON_API_BASE_URL:                    https://api.trongrid.io
      TRON_API_KEY:                         ${TRON_API_KEY}

      VAULTAI_CRYPTO_XMR_ENABLED:       "false"
      VAULTAI_CRYPTO_XMR_SEND_ENABLED:  "false"
      VAULTAI_CRYPTO_XMR_SCANNER_MODE:  none

      VAULTAI_CRYPTO_HEALTH_ADMIN_TOKEN:   ${VAULTAI_CRYPTO_HEALTH_ADMIN_TOKEN}
      VAULTAI_BILLING_HEALTH_ADMIN_TOKEN:  ${VAULTAI_BILLING_HEALTH_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/debug/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
